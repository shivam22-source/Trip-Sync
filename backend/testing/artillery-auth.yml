config:
  target: "{{ $env.TRIPSYNC_TEST_TARGET }}"
  phases:
    - duration: 60
      arrivalRate: 5

scenarios:
  - name: Authenticated read paths
    flow:
      - get:
          url: "/api/users/profile"
          headers:
            Authorization: "Bearer {{ $env.TRIPSYNC_TEST_TOKEN }}"
      - get:
          url: "/api/trips/{{ $env.TRIPSYNC_TEST_TRIP_ID }}"
          headers:
            Authorization: "Bearer {{ $env.TRIPSYNC_TEST_TOKEN }}"
