config:
  target: "{{ $env.TRIPSYNC_TEST_TARGET }}"
  phases:
    - duration: 60
      arrivalRate: 5

scenarios:
  - name: Trip expense read path
    flow:
      - get:
          url: "/api/expenses/{{ $env.TRIPSYNC_TEST_TRIP_ID }}"
          headers:
            Authorization: "Bearer {{ $env.TRIPSYNC_TEST_TOKEN }}"
