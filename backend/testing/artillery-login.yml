config:
  target: "{{ $env.TRIPSYNC_TEST_TARGET }}"
  phases:
    - duration: 60
      arrivalRate: 5
    - duration: 60
      arrivalRate: 10

scenarios:
  - name: Login
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "{{ $env.TRIPSYNC_TEST_USER_EMAIL }}"
            password: "{{ $env.TRIPSYNC_TEST_USER_PASSWORD }}"
