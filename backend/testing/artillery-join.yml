config:
  target: "{{ $env.TRIPSYNC_TEST_TARGET }}"
  phases:
    - duration: 60
      arrivalRate: 5

scenarios:
  - name: Pending join requests read path
    flow:
      - get:
          url: "/api/trips/{{ $env.TRIPSYNC_TEST_TRIP_ID }}/requests"
          headers:
            Authorization: "Bearer {{ $env.TRIPSYNC_TEST_TOKEN }}"
